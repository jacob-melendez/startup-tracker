[project]
name = "startup-tracker"
version = "0.1.0"
description = "Locally-run tracker of Bay Area startups and their open roles (see docs/SPEC.md)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies (SPEC §3). The five web ones (fastapi, jinja2, uvicorn,
# python-multipart for the note/bookmark form posts, apscheduler as the cron parser behind the
# /runs staleness check) landed with Phase 4; the scheduler service itself arrives in Phase 6.
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "selectolax>=0.4.11",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.15",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Flat application layout (db/, ingest/, web/, cli.py ...) — nothing to build or install;
# uv only manages the virtualenv and the committed lockfile.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF012", # mutable class attributes — SQLAlchemy declarative uses them by design
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
# RUF001/2/3 flag characters that could be an accidental homoglyph. In these modules the
# non-ASCII dashes and quotes are deliberate and load-bearing: the classifier's keyword compiler
# matches an en dash, an em dash and a hyphen alike ("part-time" / "part–time"), the connectors
# strip those same characters off scraped titles, and the ellipsis marks a truncated field.
"ingest/classify.py" = ["RUF001", "RUF002", "RUF003"]
"ingest/connectors/ats.py" = ["RUF001", "RUF002", "RUF003"]
"ingest/connectors/company_site.py" = ["RUF001", "RUF002", "RUF003"]
"ingest/connectors/funding_rss.py" = ["RUF001", "RUF002", "RUF003"]
"ingest/connectors/hn_hiring.py" = ["RUF001", "RUF002", "RUF003"]
# The tests assert on the same characters (a Lever salary range, a "Part–Time" title).
"tests/test_ats.py" = ["RUF001"]
"tests/test_classify.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# SPEC §3: `mypy --strict` on ingest/ and db/; the rest of the tree is held to the same bar.
files = [
    "db",
    "ingest",
    "web",
    "cli.py",
    "migrations/env.py",
    "settings.py",
    "logging_config.py",
    "tests",
]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Postgres normalizes generated-column expressions, so Alembic cannot compare the tsvector
    # Computed defaults textually; test_generated_tsvector_columns asserts them directly.
    "ignore:Computed default on .* cannot be modified:UserWarning:alembic",
]
