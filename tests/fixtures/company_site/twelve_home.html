<!doctype html>

<head>

  <!-- Recorded from https://twelve.co/ on 2026-09-04. Head trimmed to the two description
       metas plus the one <style> block that matters: Wix ships a stylesheet whose leading
       comment cites https://github.com/wix/yoshi/issues/2689. That string is NOT an anchor
       and must never become a GitHub contact — the regression case for parsing <a href>
       values rather than raw markup (SPEC §6, §4 Tier 3). -->
  <style data-href="https://static.parastorage.com/services/editor-elements-library/dist/thunderbolt/rb_wixui.thunderbolt[ImageX].cb16f202.min.css">/*! remove when this file is updated or https://github.com/wix/yoshi/issues/2689 is resolved */
.i4P7Vt{mix-blend-mode:var(--blendMode,normal);position:relative}</style>
</head>
<body>
  <!-- The footer's link column, verbatim. The LinkedIn href carries a ?viewAsMember=true
       query string and a trailing slash, and its published slug is "twelveco2" — which the
       SPEC §6 construction rule could never derive from the domain twelve.co (that yields
       "twelve"). Published beats constructed, and the two values differ. -->
  <div class="wixui-rich-text" data-testid="richTextElement"><p class="font_7 wixui-rich-text__text"><span class="wixui-rich-text__text"><a href="https://www.twelve.co/catalyst" target="_self" class="wixui-rich-text__text">Catalyst Blog</a></span></p>

<p class="font_7 wixui-rich-text__text"><span class="wixui-rich-text__text"><a href="https://www.twelve.co/subscribe" target="_self" class="wixui-rich-text__text">Newsletter</a></span></p>

<p class="font_7 wixui-rich-text__text"><span class="wixui-rich-text__text"><a href="https://www.linkedin.com/company/twelveco2/?viewAsMember=true" target="_blank" rel="noreferrer noopener" class="wixui-rich-text__text">LinkedIn</a></span></p>

<p class="font_7 wixui-rich-text__text"><span class="wixui-rich-text__text"><a href="https://www.youtube.com/@Twelve.CO2" target="_blank" rel="noreferrer noopener" class="wixui-rich-text__text">YouTube</a></span></p>

<p class="font_7 wixui-rich-text__text"><span class="wixui-rich-text__text"><a href="https://www.instagram.com/made_from_air/?hl=en" target="_blank" rel="noreferrer noopener" class="wixui-rich-text__text">Instagram</a></span></p></div>

  <!-- The footer's second link column, verbatim, trimmed to the one anchor SPEC §6 reads: an
       absolute same-domain /contact URL. Its neighbours in that column (About, Careers, Terms
       of Service, Privacy Policy) are left out because this fixture is only ever handed to the
       extractors as a single page. -->
  <div class="wixui-rich-text" data-testid="richTextElement"><p class="font_7 wixui-rich-text__text" style="line-height:1.6em;"><a href="https://www.twelve.co/contact" target="_self" class="wixui-rich-text__text">Contact</a></p></div>
</body>
