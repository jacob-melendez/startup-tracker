# SPEC §7.2, §11: per-connector refresh cadence and rate limits. This is the ONLY place a
# schedule is defined — the scheduler (Phase 6) reads it at startup; nothing in Python has a cron.
#
# cadence     five-field cron expression, evaluated in UTC; null = on-demand only.
#             Write weekdays as NAMES (mon..sun), never as numbers: APScheduler 3.x — the parser
#             both the scheduler and /runs use — numbers them Monday=0, while crontab numbers
#             them Sunday=0, so "0 4 * * 0" would fire on Monday and quietly contradict SPEC
#             §7.2's table. Names mean the same day under either convention.
# rate_limit  requests_per_second is enforced per host by ingest/http.py;
#             max_requests_per_host_per_run caps how many pages one host serves in one run
#             (SPEC §4 Tier 3: 5 pages per domain per run).
# respect_robots  fetch and honour robots.txt before every request to a host (SPEC §4).
# options     connector-specific settings, read by the connector (never by the pipeline).
#
# Only connectors with an implementation are runnable; the others are listed so the scheduler
# and docs/SOURCES.md have one place to look. Priority between connectors (SPEC §8) is NOT
# configured here — it is the fixed ordering in ingest/pipeline.py.
connectors:
  sec_edgar:
    cadence: "0 5 */3 * *"          # every 3 days, 05:00 — Form D filings trickle in
    rate_limit:
      requests_per_second: 8        # SEC fair-access policy allows at most 10/s (SPEC §4)
    respect_robots: true
    options:
      backfill_months: 18           # SPEC §14.3: first run looks back 18 months, then incremental
      overlap_days: 3               # incremental runs re-scan this many days before the last success
      search_window_days: 30        # one EFTS query window; keeps every window under the 10,000-hit cap
      exclude_industry_groups:      # Form D industry groups that are not startups (see docs/SOURCES.md)
        - Pooled Investment Fund

  ycombinator:
    cadence: "0 4 * * sun"          # weekly, Sunday 04:00 — the directory changes slowly
    rate_limit: {requests_per_second: 2}
    respect_robots: true            # www.ycombinator.com/robots.txt allows /companies
    options:
      # One query per batch: Algolia caps page-based pagination at 1,000 hits, and the largest
      # single YC batch is a few hundred companies (docs/SOURCES.md).
      partition_facet: batch
      hits_per_page: 1000
      # app_id / api_key are read from the public directory page at run time because YC rotates
      # the public search key. Set them here only as an emergency fallback.

  # --- Applicant tracking systems (SPEC §4 Tier 1 #3) ------------------------------------
  # These four connectors read a documented public JSON API *and*, when a company has no board
  # token yet, fetch that company's own /careers page to discover one (SPEC §4). A careers page
  # is an arbitrary third-party site, i.e. a Tier-3 fetch, and a connector's rate limit is set by
  # the strictest thing it touches — hence 1 request per host per 2 s rather than the API's own
  # tolerance. The limit is per *host*, so it costs about two minutes a night across ~60
  # companies and nothing at all in parallelism. No per-host budget is set: the API host serves
  # every company's board, so a 5-page cap would stop the run after five boards.
  greenhouse:
    cadence: "0 6 * * *"            # daily 06:00 — job postings turn over fast
    rate_limit: {requests_per_second: 0.5}
    respect_robots: true
    options: {max_discovery_per_run: 15}
  lever:
    cadence: "0 6 * * *"
    rate_limit: {requests_per_second: 0.5}
    respect_robots: true            # api.lever.co also sets Crawl-delay: 1, honoured on top
    options: {max_discovery_per_run: 15}
  ashby:
    cadence: "0 6 * * *"
    rate_limit: {requests_per_second: 0.5}
    respect_robots: true            # api.ashbyhq.com/robots.txt answers 401 => unrestricted
    options: {max_discovery_per_run: 15}
  workable:
    cadence: "0 6 * * *"
    rate_limit: {requests_per_second: 0.5}
    respect_robots: true
    options: {max_discovery_per_run: 15}

  hn_hiring:
    cadence: "0 9 2 * *"            # monthly, the 2nd at 09:00 — the thread posts on the 1st
    rate_limit: {requests_per_second: 5}
    respect_robots: true            # robots allows /*.json$, which is all this connector fetches
    options:
      # Three, not one: the cadence fires at 09:00 UTC and this machine is usually asleep then
      # (see the README's launchd section), so a missed month would otherwise be lost for good —
      # the connector reads newest-first and never goes back. Three covers two missed runs. The
      # one-time backfill of the archive was run at 24; that is an operation, not a setting.
      max_threads: 3
      max_comments_per_thread: 400

  funding_rss:
    cadence: "0 7 * * *"            # daily 07:00 — cheap and time-sensitive
    rate_limit: {requests_per_second: 1}
    respect_robots: true
    options:
      # The only place a feed URL is written. Any RSS or Atom funding feed may be added; see
      # docs/SOURCES.md for why Axios Pro Rata and Business Wire are not defaults.
      feeds:
        - https://techcrunch.com/category/venture/feed/
        - https://techcrunch.com/category/startups/feed/
      max_age_days: 30
      max_items_per_feed: 100

  product_hunt:
    cadence: "0 5 * * sun"          # weekly, Sunday 05:00 — not implemented yet (SPEC §4 Tier 2 #6)
    rate_limit: {requests_per_second: 1}

  company_site:
    cadence: "0 3 * * sat"          # weekly, Saturday 03:00 (and on demand for new companies)
    rate_limit:
      requests_per_second: 0.5      # SPEC §4 Tier 3: at most 1 request per domain per 2 s
      max_requests_per_host_per_run: 5
    respect_robots: true
    options:
      max_companies_per_run: 40
      depth_one_paths: [careers, jobs, about, team]   # SPEC §4 Tier 3, depth 1 only
      min_revisit_days: 6
      # SPEC §6: how much of what a company published about reaching it is kept per company.
      # Both are read off pages already fetched, so neither costs a request. Everything this
      # connector stores is confidence='published'; the constructed LinkedIn company link and
      # the "Find people →" search link are built by the pipeline on EVERY company upsert, not
      # here — so they cover companies this connector has never visited.
      max_emails_per_company: 10      # published mailto: addresses; 0 stores none
      max_people_per_company: 25      # people named on a published team page; 0 stores none

  opencorporates:
    cadence: null                   # on-demand only — enrichment, not discovery (not implemented)
    rate_limit: {requests_per_second: 1}

  # The seed loader (SPEC §10). It is a connector so it gets a fetch_runs row and the normal
  # upsert path, but it is NOT in the registry: `cli.py seed` runs it, `refresh --all` does not,
  # because re-validating the whole bootstrap list every night is pointless.
  seed:
    cadence: null                   # bootstrap only
    rate_limit: {requests_per_second: 0.5}   # 55 unrelated company sites — Tier-3 etiquette
    respect_robots: true
    options:
      validate_domains: true        # SPEC §10: HEAD each domain, follow redirects
