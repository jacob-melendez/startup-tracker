# How a group key becomes a `Sector.name`: the key is title-cased with `_and_` read as "&", so
# `ai_and_ml` -> "AI & ML" and `dev_tools_and_infra` -> "Dev Tools & Infra". Override per entry
# with `sector: Something Else`. Acronyms that must stay upper case are listed here so the
# loader has no vocabulary of its own.
sector_labels:
  ai_and_ml: AI & ML
  dev_tools_and_infra: Dev Tools & Infrastructure
  fintech: Fintech
  saas_and_work_tools: SaaS & Work Tools
  security_and_compliance: Security & Compliance
  hardware_semis_robotics: Hardware, Semis & Robotics
  quantum_and_deep_tech: Quantum & Deep Tech
  health: Health
  climate: Climate
