# SPEC §10, §14.2: the Bay Area bootstrap set, verbatim from the spec.
#
# Why it exists: cold-starting from EDGAR alone is slow, and the ATS connectors have nothing to
# discover board tokens from until some companies exist. `cli.py seed` loads this file, validates
# every domain over the network (§10) and upserts the entries through the normal pipeline.
#
# This is a bootstrap, not a target. Within a few refresh cycles `sec_edgar` and `ycombinator`
# contribute far more companies than these 58 (SPEC §10 lists 58 entries; §14.2 rounds it
# to "55 Bay Area companies").
#
# Rules for editing:
#   * fields: name, domain, city, and an optional `sector` override (the group key is the default
#     sector hint). `state` defaults to the state of the region that `config/regions.yaml` gives
#     the city; a city no region knows is an error, so the file can never smuggle in a company
#     outside the configured metros.
#   * NEVER hardcode an ATS token here — the discovery step in the Greenhouse/Lever/Ashby/
#     Workable connectors finds it (SPEC §4, §10, CLAUDE.md).
#   * `seed` is the lowest-priority connector (SPEC §8), so anything written here is overwritten
#     by the first real connector that reports the same field. Entries that have since been
#     acquired or wound down are caught by the domain validation, which marks them `dead` and
#     logs — it never fails the run (SPEC §10).

companies:
  ai_and_ml:
    - {name: OpenAI,             domain: openai.com,        city: San Francisco}
    - {name: Anthropic,          domain: anthropic.com,     city: San Francisco}
