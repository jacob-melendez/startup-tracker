# Alembic owns all DDL (SPEC §3, §5). Migrations live in migrations/versions/.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# The database URL comes from DATABASE_URL (settings.py) unless overridden programmatically —
# tests set it to their disposable database. See migrations/env.py.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
